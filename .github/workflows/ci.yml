# One small check on pull requests only (no push, schedule or Docker jobs), so it costs a few
# minutes per PR. Standard runners are free for public repositories.
name: ci
on:
  pull_request:
    branches: [main, develop]
    paths-ignore: ["**.md", "LICENSE", ".github/FUNDING.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Backend tests
        run: |
          pip install -r requirements.lock "httpx==0.28.1"
          python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
